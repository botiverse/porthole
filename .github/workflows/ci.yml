name: ci

# Every push to main, every pull request's push, and by hand: the checks (types, lint, format,
# unit tests with /server in workerd), the browser suites on loopback on each engine Porthole
# supports, the negative controls, and the prod-shape profile (P066): the host kit behind a TLS
# edge with real DNS, on same-site sibling origins, in docker compose.
# release.yml publishes a commit only once this passed on it on main, every job below by name (its
# REQUIRED_CI_JOBS; test/release.test.ts holds the two together). A run that flaked, or a commit
# without one, is run again by hand: `stamp workflow run ci.yml --repo botiverse/porthole`. Every
# Action is pinned to the commit of the release named beside it (P097).
# Pushes to main only: a tag's run would name the tag as its branch (a tag named main would pass
# for it), a release tag's commit has had main's run already, and a pull request's commits run
# once, as the pull request's (a branch push too ran everything twice, P096).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @botiverse/porthole run build
      # The built package, bundled as adopters bundle it (rolldown, esbuild for Workers), with no
      # loads left for run time; /check checks a page from its bundle (P075).
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps chromium
      - run: pnpm --filter @botiverse/porthole run test:bundle

  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm test:leak
        env:
          PORTHOLE_LEAK_ENGINES: ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopback-${{ matrix.engine }}
          path: .dev/leak-results
          retention-days: 7

  # The negative controls (P032, P096): every control in leak/controls.ts (DESIGN.md's table of
  # them, held to it by test/controls.test.ts) must fail exactly its probes, by their assertions,
  # on this engine, and nothing else; a run that didn't happen, or a probe skipped, never run or
  # timed out, fails the job.
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm --filter @botiverse/porthole run test:controls
        env:
          PORTHOLE_LEAK_ENGINES: ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controls-${{ matrix.engine }}
          path: .dev/controls
          retention-days: 7

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole run build
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps chromium
      # The shipped example app, through the suite an adopter runs.
      - run: pnpm --filter @botiverse/porthole exec playwright test -c examples/conformance/playwright.config.mjs
        env:
          PORTHOLE_ENGINES: chromium
          PORTHOLE_EXAMPLE_RESULTS: ${{ github.workspace }}/.dev/example-results

  prod-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ops/prod-shape/run.sh
        env:
          PORTHOLE_PROD_WORKERS: "2"
