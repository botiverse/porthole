name: ci

# Two sets of jobs (P146).
# On every pull request's push and every push to main, the quick set: the checks (types, lint,
# format, unit tests with /server in workerd, the bundle test), the shipped example app through the
# suite an adopter runs, and the browser suites on loopback on Chromium, in both its builds.
# By hand only (workflow_dispatch), the full set: those, and the loopback suites on WebKit and
# Firefox, the negative controls on three engines, and the prod-shape profile (P066): the host kit
# behind a TLS edge with real DNS, on same-site sibling origins, in docker compose. The full set
# ran on every push through 0.15.1 (about 420 runner minutes a run, 37,000 a week, the controls
# 86% of them); it now runs before a release, and on a branch whose change asks for it (a wall, a
# probe, a control, the shell: AGENTS.md):
#   stamp workflow run ci.yml --repo botiverse/porthole                  # main's head
#   stamp workflow run ci.yml --repo botiverse/porthole --ref <branch>   # a branch
# release.yml publishes a commit only once a run started by hand passed on it on main, every job
# below by name (its REQUIRED_CI_JOBS; test/release.test.ts holds the two together, and which jobs
# are in which set). A push's run is never that run: its full-set jobs were skipped. A run that
# flaked is started again the same way.
# Every job runs on GitHub's own runners, as release.yml does (npm trusted publishing, OIDC, takes
# a GitHub-hosted runner only): Porthole is a public repository, so they cost nothing, where
# Blacksmith's cost about $240 a week (11-03..11-09, almost all in the controls' 12 shards). They
# are slower and run fewer jobs at once, so a round takes longer and the timeouts below allow it.
# Every Action is pinned to the commit of the release named beside it (P097).
# Pushes to main only: a tag's run would name the tag as its branch (a tag named main would pass
# for it), and a pull request's commits run once, as the pull request's (a branch push too ran
# everything twice, P096).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older one's run on the same ref. A run started by hand is in a group of
# its own (its run id), so nothing cancels the full run a release is waiting for: not a merge to
# main, and not a second full run started for a newer commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The quick set: every pull request's push, every push to main, and a run started by hand.

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @botiverse/porthole run build
      # The built package, bundled as adopters bundle it (rolldown, esbuild for Workers), with no
      # loads left for run time; /check checks a page from its bundle (P075).
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps chromium
      - run: pnpm --filter @botiverse/porthole run test:bundle

  # The quick set's browser suites: every spec on Chromium. `chromium-oopif` is full Chromium, not
  # the headless shell: its cross-site frames are out of process, as in a person's browser, and
  # leak/late-word.spec.ts (P137) and every served case (leak/served) run there.
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, chromium-oopif]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps ${{ matrix.engine == 'chromium-oopif' && 'chromium' || matrix.engine }}
      - run: pnpm test:leak
        env:
          PORTHOLE_LEAK_ENGINES: ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopback-${{ matrix.engine }}
          path: .dev/leak-results
          retention-days: 7

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole run build
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps chromium
      # The shipped example app, through the suite an adopter runs.
      - run: pnpm --filter @botiverse/porthole exec playwright test -c examples/conformance/playwright.config.mjs
        env:
          PORTHOLE_ENGINES: chromium
          PORTHOLE_EXAMPLE_RESULTS: ${{ github.workspace }}/.dev/example-results

  # ---------------------------------------------------------------------------------------------
  # The full set: a run started by hand only (`if: github.event_name == 'workflow_dispatch'`, the
  # one condition a job here may carry). Before a release, on main; release.yml's gate requires it.

  # The browser suites on the other engines: `loopback`'s steps (test/release.test.ts holds them
  # equal), under its jobs' names.
  loopback-engines:
    name: loopback (${{ matrix.engine }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps ${{ matrix.engine == 'chromium-oopif' && 'chromium' || matrix.engine }}
      - run: pnpm test:leak
        env:
          PORTHOLE_LEAK_ENGINES: ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopback-${{ matrix.engine }}
          path: .dev/leak-results
          retention-days: 7

  # The negative controls (P032, P096): every control in leak/controls.ts (DESIGN.md's table of
  # them, held to it by test/controls.test.ts) must fail exactly its probes, by their verdicts, on
  # each engine, and nothing else; a run that didn't happen, or a probe skipped, never run or timed
  # out, fails. A whole engine's controls outlast a job, so each job runs one of four shards
  # (split by measured weight, `--shard k/4`), and `controls` checks every shard's verdicts: every
  # control ran and held on every engine. A shard ran about 42 minutes on Blacksmith's runners and
  # may take half again as long on GitHub's; the browser install usually takes 20 seconds but has
  # taken 21 minutes (apt mirrors), so the job allows 150 and the install fails on its own past 25,
  # naming the slow step instead of a cancelled run.
  controls-shard:
    name: controls (${{ matrix.engine }}, ${{ matrix.shard }}/4)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botiverse/porthole exec playwright install --with-deps ${{ matrix.engine }}
        timeout-minutes: 25
      - run: pnpm --filter @botiverse/porthole exec node scripts/controls.ts --shard ${{ matrix.shard }}/4
        env:
          PORTHOLE_LEAK_ENGINES: ${{ matrix.engine }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controls-${{ matrix.engine }}-${{ matrix.shard }}
          path: .dev/controls
          retention-days: 7

  controls:
    needs: controls-shard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: controls-*
          path: .dev/shards
      - run: node packages/porthole/scripts/controls.ts --summary .dev/shards

  prod-shape:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ops/prod-shape/run.sh
        env:
          PORTHOLE_PROD_WORKERS: "2"
