<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Porthole">
  <!-- The large mark: a riveted porthole onto HTML, the word drawn as strokes (no shadow on the letters, so they stay crisp). Below about 64 px use
       porthole-mark.svg, where </> stays legible. Ferry's family: Raft's yellow and ink, hard offset shadow. -->
