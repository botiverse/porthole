  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#d3ad03" transform="translate(3.5 3.5)">
      <circle cx="50" cy="50" r="30" stroke-width="9"/>
    </g>
    <g stroke="#191815">
      <circle cx="50" cy="50" r="30" stroke-width="9"/>
      <path d="M30 44 L30 56 M38 44 L38 56 M30 50 L38 50" stroke-width="4"/>
      <path d="M41 44 L49 44 M45 44 L45 56" stroke-width="4"/>
      <path d="M52 56 L52 44 L56.5 51.5 L61 44 L61 56" stroke-width="4"/>
      <path d="M64.5 44 L64.5 56 L70.5 56" stroke-width="4"/>
    </g>
  </g>
  <g fill="#ffd441">
    <circle cx="77.72" cy="61.48" r="2.3"/>
    <circle cx="61.48" cy="77.72" r="2.3"/>
    <circle cx="38.52" cy="77.72" r="2.3"/>
    <circle cx="22.28" cy="61.48" r="2.3"/>
