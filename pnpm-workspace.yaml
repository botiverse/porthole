packages:
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# Dev-only advisories (P097) whose fix the newest upstream release doesn't take yet. Each line comes
# off when its upstream ships the fixed version itself (pnpm audit --registry
# https://registry.npmjs.org says which are left).
overrides:
  # miniflare 4.20260730.0, its last 4.x release, pins undici 7.28.0 (fixed by 7.30.1: 2026-10-28's
  # audit, 10 advisories) and sharp 0.35.2 (2, fixed by 0.35.5).
  miniflare>undici: 7.30.1
  miniflare>sharp: 0.35.5
  # The ext-apps example servers 2.0.4 (the latest) pin the MCP SDK 2.0.0, whose client has
  # GHSA-6qxp-vccf-f47h (fixed by 2.2.0), and its express and node adapters 2.0.0 (fixed by 2.0.2
  # and 2.1.0). The SDK's client, server and core release together and pin one another exactly, so
  # the three move to one release; node 2.1.2 asks for that server (^2.4.0).
  "@modelcontextprotocol/client": 2.4.0
  "@modelcontextprotocol/server": 2.4.0
  "@modelcontextprotocol/core": 2.4.0
  "@modelcontextprotocol/express": 2.0.2
  "@modelcontextprotocol/node": 2.1.2
